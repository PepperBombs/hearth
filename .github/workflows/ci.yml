# Checks every pull request and every push to main: the framework by itself
# (check), end to end with the sample mini-apps (e2e), and with the mini-apps
# of hearth-stones, as the server would build the two, end to end included
# (mini-apps).
#
# Rules for this file, because the repository is public:
#   - GitHub-hosted runners only. Never "self-hosted": a pull request from a
#     stranger would then run on a machine we own.
#   - No secrets. Nothing here needs one, and pull requests from forks could
#     not read them anyway.
#   - The token is read-only.
#   - Every action is pinned to a full commit hash, with its version in a
#     comment. To update one, change the hash and the comment together.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces the run before it. Runs on main
  # are never cancelled, so every commit there gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node and restore the pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
        env:
          # Fail, rather than skip TypeScript files, if typescript-eslint
          # cannot be loaded. See docs/architecture.md, "Checks".
          HEARTH_LINT_STRICT: "1"

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install Node and restore the pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Builds the web app and serves it itself; see playwright.config.ts.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Keep the test output if something failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # This commit with main of hearth-stones: the pair the server builds once
  # this commit is on main. The two are checked out side by side, as on the
  # server, because hearth-stones links the SDK as ../hearth/packages/sdk.
  # See docs/mini-app-contract.md, section A7, "CI".
  mini-apps:
    name: Build with the mini-apps of hearth-stones
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hearth
          persist-credentials: false

      - name: Check out main of hearth-stones beside it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/hearth-stones
          ref: main
          path: hearth-stones
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: hearth/package.json

      - name: Install Node and restore the pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: hearth/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: hearth
        run: pnpm install --frozen-lockfile

      # As the deploy does it: the mini-apps' lockfile holds nothing but the
      # link to the SDK, so the install needs no network.
      - name: Link the mini-apps to this SDK
        working-directory: hearth-stones
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile --offline
          else
            echo "hearth-stones has no package.json yet: it holds no mini-apps."
          fi

      # hearth-apps ends with status 3 for one thing only: mini-apps written
      # for another version of the SDK. That is expected after this
      # repository raises the version and until hearth-stones follows; the
      # server keeps the release it runs meanwhile. Any other failure means
      # that a change here broke the mini-apps without raising the version.
      - name: Check the mini-apps against this SDK
        id: apps
        working-directory: hearth
        env:
          HEARTH_APPS_DIR: ../hearth-stones
        run: |
          status=0
          node packages/sdk/bin/hearth-apps.mjs check || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::notice title=Mini-apps not built::main of hearth-stones was written for another version of the SDK than this commit holds (the lines above name both). Merge the matching change into hearth-stones after this one; until then the server keeps the release it runs."
            exit 0
          fi
          if [ "$status" -eq 0 ]; then
            echo "fit=true" >>"$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Build with them
        if: ${{ steps.apps.outputs.fit == 'true' }}
        working-directory: hearth
        env:
          HEARTH_APPS_DIR: ../hearth-stones
        run: pnpm build

      - name: Install Chromium for Playwright
        if: ${{ steps.apps.outputs.fit == 'true' }}
        working-directory: hearth
        run: pnpm exec playwright install --with-deps chromium

      # Two people of a family using the mini-apps on one server, from
      # e2e/mini-apps: the file of each app that hearth-stones holds.
      # See playwright.mini-apps.config.ts.
      - name: End-to-end tests of the mini-apps
        if: ${{ steps.apps.outputs.fit == 'true' }}
        working-directory: hearth
        env:
          HEARTH_APPS_DIR: ../hearth-stones
        run: pnpm e2e:mini-apps

      - name: Keep the test output if something failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-mini-apps
          path: hearth/test-results/
          if-no-files-found: ignore
          retention-days: 7
