<!doctype html>
<html>
<head>
<title>GitHub Trending</title>
<style>
/*
 * GitHub Trending, as an app made in Hearth: the new repositories on GitHub
 * with the most stars, created in the last day, week or month. Its card
 * shows the first five of each person's own range; its page every list, by
 * range and by the languages the space follows, with the Hide list.
 * Colours come from Hearth's variables only, so that both themes fit.
 */
*, *::before, *::after { box-sizing: border-box; }
/* Room for the focus ring of a control at the edge: the frame cuts off whatever lies outside it. */
body { padding: 4px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--hearth-accent); outline-offset: 2px; }
button { font: inherit; color: inherit; margin: 0; }
button:not([aria-disabled="true"]) { cursor: pointer; }
h2, h3, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.num { font-variant-numeric: tabular-nums; }
svg { flex: none; }

/* A long name wraps rather than reaching past the edge of a narrow card or phone. */
.app { overflow-wrap: anywhere; }
/* The page's parts lie 16px apart; one with nothing in it (no message, nothing hidden) takes no room. */
.page > :not(:empty):not([hidden]) ~ :not(:empty):not([hidden]) { margin-top: 16px; }

/* When the lists were fetched and "Refresh now"; a banner in its place when the last refresh failed. */
.top {
  display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 8px; min-height: 28px;
  font-size: 12px; line-height: 20px; color: var(--hearth-text-3);
}
.top-text { min-width: 0; flex: 1 1 auto; }
.top .warn { display: none; }
.top.banner {
  padding: 8px 12px; border: 1px solid var(--hearth-line); border-radius: 8px; background: var(--hearth-surface-2);
  color: var(--hearth-text); font-size: 13px; line-height: 1.57;
}
.top.banner .warn { display: block; color: var(--hearth-text-2); }
.top.banner .top-text { flex-basis: 224px; }
.top-status, .top .btn { margin-left: auto; }

.btn {
  display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--hearth-line); border-radius: 8px; background: var(--hearth-surface); color: var(--hearth-text);
  font-weight: 500; line-height: 1; white-space: nowrap; user-select: none; -webkit-user-select: none;
}
.btn:hover:not([aria-disabled="true"]) { background: var(--hearth-surface-2); }
.btn[aria-disabled="true"] { cursor: not-allowed; opacity: .55; }
.btn.small { height: 28px; padding: 0 8px; font-size: 12px; }

/* The range, one of three, and the languages the space follows. */
.controls { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; max-width: 100%; padding: 2px; border-radius: 8px; background: var(--hearth-surface-2); }
.seg button {
  height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--hearth-text-2);
  font-size: 13px; line-height: 1; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--hearth-surface); color: var(--hearth-text); font-weight: 500; box-shadow: 0 0 0 1px var(--hearth-line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid var(--hearth-line);
  border-radius: 999px; background: transparent; color: var(--hearth-text-2); font-size: 13px; line-height: 1;
}
.chip[aria-pressed="true"] { border-color: var(--hearth-accent); background: var(--hearth-accent-soft); color: var(--hearth-accent-text); font-weight: 500; }

/* The lists: rows split by hairlines. */
.rows { display: flex; flex-direction: column; }
.rows:focus { outline: none; }
.rows:focus-visible { outline: 2px solid var(--hearth-accent); }
.row {
  display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 36px; padding: 6px 0;
  border-top: 1px solid var(--hearth-line);
}
.row:first-child { border-top: 0; }
.rank { flex: none; width: 24px; align-self: flex-start; text-align: right; color: var(--hearth-text-3); }
.body { flex: 1; min-width: 0; align-self: flex-start; }
.owner { color: var(--hearth-text-2); }
.name { color: var(--hearth-text); font-weight: 500; }
.plain { color: var(--hearth-text); }
.desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: var(--hearth-text-2); }
.meta { display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; margin-top: 2px; font-size: 12px; line-height: 20px; color: var(--hearth-text-3); }
.stars { display: inline-flex; align-items: center; gap: 4px; }
.row .btn { align-self: flex-start; }
.hid-text { flex: 1; min-width: 0; font-size: 13px; color: var(--hearth-text-2); }
.grow { flex: 1; min-width: 0; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 420px; margin: 0 auto; padding: 32px 8px; text-align: center; }
.empty:focus { outline: none; }
.empty h2, .empty h3 { font-size: 16px; line-height: 1.4; font-weight: 600; }
.hidden-box { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.hidden-box .rows { align-self: stretch; }

/* The card on the dashboard. */
.card { display: flex; flex-direction: column; min-height: 88px; }
.caption { font-size: 12px; line-height: 20px; color: var(--hearth-text-3); }
.card .rank { width: 16px; align-self: center; font-size: 12px; }
.card .stars { flex: none; font-size: 12px; color: var(--hearth-text-3); }
.card .empty { flex: 1; min-height: 88px; padding: 8px; }
.foot { margin-top: auto; padding-top: 8px; font-size: 12px; line-height: 20px; color: var(--hearth-text-3); }
.foot .failed { padding: 6px 10px; border: 1px solid var(--hearth-line); border-radius: 8px; background: var(--hearth-surface-2); color: var(--hearth-text); }

/* A change that failed, and the app that could not be read. */
.notice {
  display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border: 1px solid var(--hearth-line);
  border-radius: 8px; background: var(--hearth-surface-2); color: var(--hearth-text); font-size: 12px; line-height: 20px;
}
.notice svg { margin-top: 3px; color: var(--hearth-text-2); }
.card .notice { margin-top: 8px; }
.failed-load { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 6px 0; }
.failed-load p { color: var(--hearth-text-2); }
.skeleton { display: flex; flex-direction: column; gap: 14px; padding: 8px 0; }
.bone { height: 14px; border-radius: 6px; background: var(--hearth-surface-2); animation: pulse 1.6s ease-in-out infinite; }
.bone.short { width: 40%; }
@keyframes pulse { 50% { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .bone { animation: none; } }

/* Touch screens get 44px targets. */
@media (pointer: coarse) {
  .btn, .btn.small { height: 44px; padding: 0 12px; }
  .seg button { height: 40px; padding: 0 16px; }
  .chip { height: 36px; padding: 0 14px; }
  .row { min-height: 44px; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(() => {
  "use strict";

  /** The languages a space may follow, in the order of the setting's options, which is the order of the searches. Their names read the same in both languages. */
  const LANGUAGE_NAMES = {
    typescript: "TypeScript",
    javascript: "JavaScript",
    python: "Python",
    go: "Go",
    rust: "Rust",
    java: "Java",
    cpp: "C++",
    csharp: "C#",
    swift: "Swift",
    kotlin: "Kotlin",
  };

  // Every text of the interface, in both languages: the build's app's own, and a few for what this page does itself.
  const TEXT = {
    en: {
      title: "GitHub Trending",
      ranges: { day: "Today", week: "This week", month: "This month" },
      all: "All",
      range: "Range",
      language: "Language",
      updatedNow: "Updated just now",
      updatedMinutes: "Updated {minutes} min ago",
      updatedAt: "Updated at {time}",
      refresh: "Refresh now",
      refreshing: "Refreshing…",
      refreshingCount: "Refreshing… {done}/{total}",
      failed: "Couldn't reach GitHub at {time}.",
      failedShowing: "Couldn't reach GitHub at {time}. Showing results from {previous}.",
      retry: "Try again",
      emptyFirst: "No results yet. The first refresh is on its way.",
      emptySet: "No new repositories here yet.",
      stars: "{count} stars",
      forks: "{count} forks",
      ageHours: "{count} h old",
      ageDays: "{count} d old",
      newTab: "opens in a new tab",
      hide: "Hide",
      hid: "Hid {name}.",
      undo: "Undo",
      hidden: "Hidden ({count})",
      show: "Show again",
      hiddenFull: "The Hide list holds 1000 repositories, as many as it can. Show some of them again first.",
      changeFailed: "That change could not be saved. Try again.",
      startFailed: "The refresh could not be started. Try again.",
      loading: "Loading…",
      loadFailed: "This app could not be loaded.",
    },
    zh: {
      title: "GitHub 热门",
      ranges: { day: "今天", week: "本周", month: "本月" },
      all: "全部",
      range: "时间范围",
      language: "语言",
      updatedNow: "刚刚更新",
      updatedMinutes: "{minutes} 分钟前更新",
      updatedAt: "更新于 {time}",
      refresh: "立即刷新",
      refreshing: "正在刷新…",
      refreshingCount: "正在刷新… {done}/{total}",
      failed: "{time} 时无法连接 GitHub。",
      failedShowing: "{time} 时无法连接 GitHub。现在显示的是 {previous} 的结果。",
      retry: "重试",
      emptyFirst: "还没有结果，第一次刷新马上就到。",
      emptySet: "这里还没有新仓库。",
      stars: "{count} 星",
      forks: "{count} 个分叉",
      ageHours: "{count} 小时前创建",
      ageDays: "{count} 天前创建",
      newTab: "在新标签页中打开",
      hide: "隐藏",
      hid: "已隐藏 {name}。",
      undo: "撤销",
      hidden: "已隐藏（{count}）",
      show: "重新显示",
      hiddenFull: "隐藏列表最多放 1000 个仓库，现在已经满了。请先重新显示其中一些。",
      changeFailed: "这项更改未能保存，请重试。",
      startFailed: "刷新没能开始，请重试。",
      loading: "正在加载…",
      loadFailed: "这个应用无法加载。",
    },
  };

  const hearth = window.hearth;
  if (!hearth) return;
  const locale = hearth.locale === "zh" ? "zh" : "en";
  const t = TEXT[locale];
  const say = (text, values) => text.replace(/\{(\w+)\}/g, (whole, key) => (key in values ? String(values[key]) : whole));
  document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
  document.title = t.title;

  const canEdit = hearth.access === "edit";
  const inCard = hearth.view === "card";
  const REPOS = "repos";
  const HIDDEN = "hidden";
  const REFRESHES = "refreshes";

  // ------------------------------------------------------- GitHub's search
  // What the build's job (`refresh` in hearth-stones/trending/server.ts) did, as it did it.

  /** The ranges, in the order the searches go: repositories created in the last day, week and month. */
  const RANGES = ["day", "week", "month"];
  /**
   * How far back each range reaches, and the fewest forks a repository needs
   * to be listed in it. `forks:>=10` was measured to leave out most spam for
   * a week; a day gives a real project less time to be forked, and a month
   * asks for less than four weeks' worth, so that a project that rose late
   * in it stays.
   */
  const REACH = { day: { days: 1, forks: 3 }, week: { days: 7, forks: 10 }, month: { days: 30, forks: 25 } };
  const LANGUAGES = Object.keys(LANGUAGE_NAMES);
  /** GitHub's search of repositories, on the one host the manifest lists in `network`. */
  const SEARCH = "https://api.github.com/search/repositories";
  /** What every search asks for: GitHub's JSON, in the version of its REST API this app is written against. */
  const GITHUB_HEADERS = { accept: "application/vnd.github+json", "x-github-api-version": "2022-11-28" };
  /** How many repositories a list holds at most: one page of a search. */
  const PER_PAGE = 25;
  /** The longest description kept, in characters, which is also GitHub's own limit. */
  const LONGEST_DESCRIPTION = 350;
  /** The longest language name kept, in characters. GitHub's are far shorter. */
  const LONGEST_LANGUAGE = 60;
  /** How many repositories a space's Hide list holds at most, so that every list can leave out all of them. */
  const MOST_HIDDEN = 1000;
  const MINUTE_MS = 60 * 1000;
  const HOUR_MS = 60 * MINUTE_MS;
  const DAY_MS = 24 * HOUR_MS;
  /** owner/name as GitHub allows them, so that a link built from one can only lead into github.com. */
  const FULL_NAME = /^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9._-]{1,100}$/;
  /** A moment as GitHub writes `created_at`: a date, a time to the second and Z or an offset (RFC 3339). */
  const DATE_TIME =
    /^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|[+-](?:[01]\d|2[0-3]):[0-5]\d)$/;

  /**
   * The deny-list: the spam GitHub's search still lets through after the
   * query's own filters, as three patterns. A repository matches when its
   * owner/name and description, with `-`, `_`, `.` and `/` read as spaces,
   * match one: "Fake_Balance.v2" holds the words "Fake Balance".
   */
  const SPAM = [
    // A year, then "installer": "XYZ 2026: Full-Feature Desktop Installer". Not "nix-installer".
    /\b(?:19|20)\d\d\b.*\binstaller\b/i,
    // Crypto bots: "solana-mint-bot", "pump sniper bot", "wallet drainer bot", "volume bot". Not "mint-theme".
    /\b(?:mint|sniper|drainer|volume) ?bot\b/i,
    // Fake balances: "Fake-Balance" wallet tools, "flash USDT". Not "flash-attention", nor "fake-balancer".
    /\b(?:fake ?balance|flash ?usdt)\b/i,
  ];
  const isSpam = (fullName, description) => {
    const text = `${fullName} ${description}`.replace(/[-_./]/g, " ");
    return SPAM.some((pattern) => pattern.test(text));
  };

  /**
   * The address of one search: repositories created since the run's start
   * less the range's days, in UTC to the second, that are no fork, not
   * archived and forked at least the range's fewest times, of one language
   * when `language` is not "", most stars first, one page of them.
   */
  function searchUrl(range, language, started) {
    const { days, forks } = REACH[range];
    const since = new Date(started.getTime() - days * DAY_MS).toISOString().slice(0, 19);
    const terms = [`created:>=${since}+00:00`, "fork:false", "archived:false", `forks:>=${forks}`];
    if (language !== "") terms.push(`language:${language}`);
    const query = new URLSearchParams({ q: terms.join(" "), sort: "stars", order: "desc", per_page: String(PER_PAGE) });
    return `${SEARCH}?${query}`;
  }

  const isRecord = (value) => typeof value === "object" && value !== null && !Array.isArray(value);
  const isCount = (value) => Number.isSafeInteger(value) && value >= 0;
  const textOrNull = (value) => typeof value === "string" || value === null;
  /** A repository as GitHub's search lists one, with every field this app reads. */
  const isFound = (item) =>
    isRecord(item) &&
    Number.isSafeInteger(item.id) &&
    item.id > 0 &&
    typeof item.full_name === "string" &&
    textOrNull(item.description) &&
    textOrNull(item.language) &&
    isCount(item.stargazers_count) &&
    isCount(item.forks_count) &&
    typeof item.created_at === "string" &&
    DATE_TIME.test(item.created_at);

  const cut = (text, length) => (text.length <= length ? text : `${text.slice(0, length - 1)}…`);
  const messageOf = (error) => (error instanceof Error ? error.message : String(error));

  /**
   * The repositories of one search's answer, or why the run fails: GitHub
   * turned it down (403 and 429 are its answers to too many searches), said
   * something else than 2xx, answered with something else than a list of
   * repositories, or cut the search short (`incomplete_results`: it ran out
   * of time and gives what it found so far, maybe nothing).
   */
  function foundIn(answer) {
    if (answer.status === 403 || answer.status === 429) {
      throw new Error(`GitHub turned the search down (${answer.status}), most likely for its rate limit.`);
    }
    if (!answer.ok) throw new Error(`GitHub's search answered ${answer.status}.`);
    let body;
    try {
      body = JSON.parse(answer.text);
    } catch (error) {
      throw new Error(`The answer from ${SEARCH} is not JSON (${cut(messageOf(error), 120)}).`);
    }
    const shaped =
      isRecord(body) &&
      (body.incomplete_results === undefined || typeof body.incomplete_results === "boolean") &&
      Array.isArray(body.items) &&
      body.items.every(isFound);
    if (!shaped) throw new Error("GitHub's search did not answer with a list of repositories.");
    if (body.incomplete_results === true) {
      throw new Error("GitHub's search ran out of time and gave only part of its results (incomplete_results).");
    }
    return body.items;
  }

  /** Whether a repository goes into the lists: a name GitHub could have given, and no spam. */
  const keep = (repo) => FULL_NAME.test(repo.full_name) && !isSpam(repo.full_name, repo.description ?? "");

  /** A text on one line, and at most `longest` characters, "…" last when cut, never half of a character. */
  function oneLine(text, longest) {
    const line = text.replace(/\s+/g, " ").trim();
    if (line.length <= longest) return line;
    // A character beyond the basic plane takes two places, and is not cut in half.
    return `${line.slice(0, longest - 1).replace(/[\uD800-\uDBFF]$/, "")}…`;
  }

  /** A repository of a search as a row of `repos` keeps it. */
  const rowOf = (repo, range, set, position) => ({
    range,
    set,
    position,
    githubId: repo.id,
    fullName: repo.full_name,
    description: oneLine(repo.description ?? "", LONGEST_DESCRIPTION),
    language: oneLine(repo.language ?? "", LONGEST_LANGUAGE),
    stars: repo.stargazers_count,
    forks: repo.forks_count,
    repoCreatedAt: new Date(repo.created_at).toISOString(),
  });

  // ------------------------------------------------------- Times and counts
  // In the reader's language and time zone, against the browser's clock, on a 24-hour clock.

  const TAG = locale === "zh" ? "zh-CN" : "en-US";
  const timeFormat = new Intl.DateTimeFormat(TAG, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const dateTimeFormat = new Intl.DateTimeFormat(TAG, { dateStyle: "medium", timeStyle: "short", hourCycle: "h23" });
  const wholeFormat = new Intl.NumberFormat(TAG);
  const compactFormat = new Intl.NumberFormat(TAG, { notation: "compact", maximumFractionDigits: 1 });
  /** A count in full, "12,345"; in few characters, "12.3K", "1.2万". */
  const whole = (value) => wholeFormat.format(value);
  const compact = (value) => compactFormat.format(value);
  /** A moment and its date: "Nov 10, 2026, 08:05", "2026年11月10日 08:05". */
  const dateAndTime = (ms) => dateTimeFormat.format(new Date(ms));
  /** A moment as a time of day, "14:05", or with its date when it is not today's. */
  function momentText(ms) {
    const day = (value) => new Date(value).toDateString();
    return day(ms) === day(now) ? timeFormat.format(new Date(ms)) : dateAndTime(ms);
  }
  /**
   * When the lists shown were fetched: "Updated just now" under a minute (a
   * time a little ahead of this browser's clock included), "Updated 12 min
   * ago" under 90 minutes, then "Updated at 13:05".
   */
  function updatedText(at) {
    const minutes = Math.floor((now - at) / MINUTE_MS);
    if (minutes < 1) return t.updatedNow;
    if (minutes < 90) return say(t.updatedMinutes, { minutes });
    return say(t.updatedAt, { time: momentText(at) });
  }
  /** How old a repository is: "5 h old" under 48 hours, then "3 d old"; never less than an hour. */
  function ageText(createdAt) {
    const hours = Math.max(1, Math.floor((now - Date.parse(createdAt)) / HOUR_MS));
    return hours < 48 ? say(t.ageHours, { count: hours }) : say(t.ageDays, { count: Math.floor(hours / 24) });
  }

  // ------------------------------------------------------- What is stored
  //
  // `refreshes` holds a row for each of the newest 20 refreshes: `at` when it
  // started (by the server's clock once it has ended), then `ok` and `error`.
  // A refresh going on has ok false and error "running", and touches its row
  // after every search, so that its `updatedAt` says it is still alive; a
  // silent one counts as gone (its page was closed) and as never started.
  // When it ends, its row's `updatedAt` is when it ended.

  /** How long a refresh may stay silent before it counts as gone: its page was closed, say. One search waits a minute at most. */
  const SILENT_MS = 60 * 1000;
  /** A refresh starts by itself when the last one started more than this long ago. */
  const REFRESH_EVERY_MS = HOUR_MS;
  const KEEP_REFRESHES = 20;
  /** The clock is read again this often, and what others changed is read again every POLL_MS, or BUSY_POLL_MS while a refresh is going on elsewhere. */
  const TICK_MS = 5000;
  const POLL_MS = 15000;
  const BUSY_POLL_MS = 5000;
  /** After a refresh that could not even start, the page waits this long before it starts one by itself again. */
  const START_AGAIN_MS = 5 * MINUTE_MS;

  let now = Date.now();
  let loaded = false;
  let loadFailed = false;
  /** The refreshes, the one that started last first. */
  let refreshes = [];
  /** The Hide list, the last hidden first, each repository once. */
  let hidden = [];
  let hiddenIds = new Set();
  /** The lists, by range and set: "week\n" for this week's of every language, "week\nrust" for its Rust. */
  let lists = new Map();
  /** When the lists were last written, for lists no refresh row tells of (the build's app's, moved here). */
  let listsWrittenAt = null;
  let anyLists = false;
  /** Which good refresh the lists were read after: read again when another has gone well. */
  let listsReadFor = null;
  let followed = [];
  let ownRange = "week";
  let hideDescriptions = false;

  /** The range picked here, until it is saved as the reader's own (or their own changes elsewhere). */
  let picked = null;
  let rangeSave = null;
  let pickedLanguage = "";
  /** This page's own refresh: the search it is at, of how many, and its row. */
  let run = null;
  let noStartBefore = 0;
  /** A repository this page has just hidden, and where it stood, for "Hid owner/name. Undo" in its place. */
  let hid = null;
  const hiding = new Set();
  const showing = new Set();
  let hiddenOpen = false;
  /** Where the keyboard goes once an action's change is drawn: `selectors`, when `from`, the control the action began at, has gone. */
  let focusNext = null;

    const user = isRecord(settings) && isRecord(settings.user) ? settings.user : {};
    const languages = Array.isArray(space.languages) ? space.languages : [];
    followed = LANGUAGES.filter((key) => languages.includes(key));
    ownRange = RANGES.includes(user.range) ? user.range : "week";
    hideDescriptions = user.hideDescriptions === true;
  }

  /** Which good refresh the lists now come from. */
  const goodRefreshKey = () => {
    const lastOk = newest(refreshes.filter((row) => row.ok === true), lastSignOf);
    return lastOk === null ? "" : `${lastOk.id} ${lastOk.updatedAt}`;
  };

  let reading = null;
  let readAgain = false;
  let readLists = false;
  let lastRead = 0;
  /** How many changes this page made to the Hide list and to its settings: a read asked before one may answer from before it. */
  let ownChanges = 0;

  /**
   * Reads the refreshes, the Hide list and the settings, and the lists when
   * `withLists` or when another refresh went well since they were read; then
   * draws them, and starts a refresh when one is due. Asked while a read is
   * on its way, it reads once more after that one.
   */
  function read(withLists) {
    if (withLists) readLists = true;
    if (reading) {
      readAgain = true;
      return reading;
    }
    reading = (async () => {
      try {
        do {
          readAgain = false;
          const wanted = readLists || !loaded;
          readLists = false;
          lastRead = Date.now();
          const changes = ownChanges;
          const [refreshRows, hiddenRows, settings] = await Promise.all([
            hearth.list(REFRESHES, { orderBy: "createdAt", desc: true, limit: 200 }),
            hearth.list(HIDDEN, { orderBy: "createdAt", desc: true, limit: 5000 }),
            hearth.settings(),
          ]);
          refreshes = keepRefreshes(Array.isArray(refreshRows) ? refreshRows : []);
          watchSigns(refreshes);
          // This page changed the Hide list or its settings while they were read: what came back may be from before, so they are read again.
          if (changes === ownChanges) {
            keepHidden(Array.isArray(hiddenRows) ? hiddenRows : []);
            keepSettings(settings);
          } else readAgain = true;
          const key = goodRefreshKey();
          if (wanted || key !== listsReadFor) {
            const rows = await hearth.list(REPOS, { orderBy: "position", limit: 5000 });
            keepLists(Array.isArray(rows) ? rows : []);
            listsReadFor = key;
          }
          loaded = true;
        } while (readAgain);
      } finally {
        reading = null;
      }
      // Once the repository is back in the list (Undo, or "Show again" here or anywhere else), there is nothing to undo.
      if (hid !== null && !hiddenIds.has(hid.githubId) && !showing.has(hid.githubId)) hid = null;
      draw();
      startIfDue();
    })();
    return reading;
  }

  function start() {
    read(true).catch(() => {
      if (loaded) return;
      loadFailed = true;
      draw();
    });
  }

  // ------------------------------------------------------- Refreshing

  /** Starts a refresh by itself, for whoever may edit, when the last one is more than an hour old and none is going on. */
  function startIfDue() {
    if (!canEdit || !loaded || run !== null || document.visibilityState === "hidden" || Date.now() < noStartBefore) return;
    now = Date.now();
    const state = situation();
    if (!state.elsewhere && state.due) startRefresh(false);
  }

  /**
   * A refresh: one search for every language and one for each language the
   * space follows, in each range (day first, then week, then month; within a
   * range every language first, then the languages in the order of the
   * setting's options), each paced by the server, about 6.5 seconds apart.
   * Nothing is written until every search has answered, so a refresh that
   * fails leaves the lists of the last one that went well.
   */
  async function startRefresh(asked) {
    if (!canEdit || run !== null) return;
    now = Date.now();
    if (situation().elsewhere) return;
    const languages = [...followed];
    const plan = RANGES.flatMap((range) => ["", ...languages].map((set) => ({ range, set })));
    run = { rowId: null, search: 1, total: plan.length };
    clearNotice();
    draw();
    let mine;
    const sent = Date.now();
    try {
      mine = await hearth.add(REFRESHES, { at: new Date(serverNow()).toISOString(), ok: false, error: "running" });
    } catch {
      run = null;
      noStartBefore = Date.now() + START_AGAIN_MS;
      if (asked) showNotice(t.startFailed);
      draw();
      return;
    }
    learnClock(mine, sent);
    // The run starts when the server wrote its row, by the server's clock, as the build's job did: this browser's may be off.
    const started = new Date(timeOf(mine.createdAt) || serverNow());
    run.rowId = mine.id;
    speak(announcer, t.refreshing);
    try {
      // Two pages may have started at once: the one whose row came first goes on, the other gives way.
      const rows = keepRefreshes(await hearth.list(REFRESHES, { orderBy: "createdAt", desc: true, limit: 200 }));
      watchSigns(rows);
      const first = (row) => timeOf(row.createdAt) < timeOf(mine.createdAt) || (row.createdAt === mine.createdAt && row.id < mine.id);
      if (rows.some((row) => row.id !== mine.id && isAlive(row) && first(row))) {
        run = null;
        // Not again until that one has had time to say how it goes.
        noStartBefore = Date.now() + BUSY_POLL_MS;
        await hearth.remove(REFRESHES, mine.id).catch(() => {});
        await read().catch(() => {});
        return;
      }
      // Only the newest 20 are kept.
      const old = [...rows].sort((a, b) => timeOf(b.createdAt) - timeOf(a.createdAt)).slice(KEEP_REFRESHES);
      for (const row of old) await hearth.remove(REFRESHES, row.id).catch(() => {});
    } catch {
      // Whether another started too is not known: this one goes on.
    }

    let failure = null;
    try {
      const found = [];
      for (const [index, { range, set }] of plan.entries()) {
        run.search = index + 1;
        draw();
        const answer = await hearth.fetch(searchUrl(range, set, started), { headers: GITHUB_HEADERS });
        const items = foundIn(answer);
        found.push({ range, set, rows: items.filter(keep).slice(0, PER_PAGE).map((repo, position) => rowOf(repo, range, set, position)) });
        // A sign of life after every search, so that other pages know this refresh is still going on.
        if (index < plan.length - 1) {
          const signed = Date.now();
          await hearth.update(REFRESHES, mine.id, { error: "running" }).then((row) => learnClock(row, signed), () => {});
        }
      }
      // Every search answered: each list in place of the one before, then the lists of languages no longer followed go.
      for (const { range, set, rows } of found) await hearth.replace(REPOS, { range, set }, rows);
      const stored = await hearth.list(REPOS, { orderBy: "position", limit: 5000 });
      const sets = new Set((Array.isArray(stored) ? stored : []).map((row) => row.set));
      for (const set of sets) {
        if (typeof set === "string" && set !== "" && !languages.includes(set)) await hearth.replace(REPOS, { set }, []);
      }
      await hearth.update(REFRESHES, mine.id, { at: started.toISOString(), ok: true, error: "" });
    } catch (error) {
      failure = cut(messageOf(error), 500);
      await hearth.update(REFRESHES, mine.id, { at: started.toISOString(), ok: false, error: failure }).catch(() => {});
    }
    run = null;
    await read(true).catch(() => {});
    draw();
    if (failure === null) speak(announcer, t.updatedNow);
    else speak(shouter, failureText(situation()) ?? say(t.failed, { time: momentText(Date.now()) }));
  }

  // ------------------------------------------------------- Choosing

  /** The range is the reader's own setting: picked here, it is saved as theirs, so their card follows. */
  function pickRange(range) {
    if (range === shownRange()) return;
    picked = { range, own: ownRange };
    // "Hid owner/name. Undo" is about the list it was hidden from: another list does not show it.
    hid = null;
    clearNotice();
    draw();
    if (rangeSave === null) rangeSave = saveRange().finally(() => (rangeSave = null));
  }

  async function saveRange() {
    for (;;) {
      const wanted = picked !== null && picked.own === ownRange ? picked.range : null;
      if (wanted === null || wanted === ownRange) return;
      let saved;
      try {
        saved = await hearth.saveSettings({ user: { range: wanted } });
      } catch {
        ownChanges += 1;
        // The range picked stays on this page; the reader's own stays as it was.
        showNotice(t.changeFailed);
        return;
      }
      ownChanges += 1;
      const latest = picked !== null ? picked.range : wanted;
      keepSettings(saved);
      // Picked again meanwhile: that one is saved next.
      picked = latest === ownRange ? null : { range: latest, own: ownRange };
      draw();
    }
  }

  function pickLanguage(language) {
    if (language === shownLanguage()) return;
    pickedLanguage = language;
    hid = null;
    clearNotice();
    draw();
  }

  // ------------------------------------------------------- Hiding

  /** After a change that failed: reads everything again and says so. */
  async function afterFailure(text) {
    showNotice(text);
    await read(true).catch(() => {});
  }

  /** Puts a repository on the space's Hide list, once: every list leaves it out, for everyone in the space. */
  async function hideRepo(repo, place) {
    if (!canEdit || hiding.has(repo.githubId)) return;
    const range = shownRange();
    const language = shownLanguage();
    hiding.add(repo.githubId);
    clearNotice();
    draw();
    try {
      // Read now, not from the screen: someone may have hidden it, or many others, since.
      const rows = await hearth.list(HIDDEN, { orderBy: "createdAt", desc: true, limit: 5000 });
      const all = Array.isArray(rows) ? rows : [];
      if (!all.some((row) => isRecord(row) && row.githubId === repo.githubId)) {
        if (all.length >= MOST_HIDDEN) {
          hiding.delete(repo.githubId);
          await afterFailure(t.hiddenFull);
          return;
        }
        await hearth.add(HIDDEN, { githubId: repo.githubId, fullName: repo.fullName });
      }
    } catch {
      ownChanges += 1;
      hiding.delete(repo.githubId);
      await afterFailure(t.changeFailed);
      return;
    }
    ownChanges += 1;
    hiding.delete(repo.githubId);
    // On the Hide list now, the last hidden first: shown at once, and read again after.
    if (!hiddenIds.has(repo.githubId)) keepHidden([{ githubId: repo.githubId, fullName: repo.fullName }, ...hidden]);
    hid = { githubId: repo.githubId, fullName: repo.fullName, range, language, place };
    focusAfter(["[data-undo]"]);
    draw();
    await read().catch(() => {});
    draw();
    focusNext = null;
  }

  /** Takes a repository off the space's Hide list; `focus` says where the keyboard goes once it is back. */
  async function show(githubId, focus) {
    if (!canEdit || showing.has(githubId)) return false;
    showing.add(githubId);
    clearNotice();
    draw();
    try {
      await hearth.replace(HIDDEN, { githubId }, []);
    } catch {
      ownChanges += 1;
      showing.delete(githubId);
      await afterFailure(t.changeFailed);
      return false;
    }
    ownChanges += 1;
    showing.delete(githubId);
    keepHidden(hidden.filter((entry) => entry.githubId !== githubId));
    if (hid !== null && hid.githubId === githubId) hid = null;
    focusAfter(focus);
    draw();
    await read().catch(() => {});
    draw();
    focusNext = null;
    return true;
  }

  const undo = (entry) => show(entry.githubId, [`[data-hide="${entry.githubId}"]`]);
  // While something is still hidden, "Hidden (n)"; after the last, the repository's own "Hide", or the list, or the range.
  const showAgain = (githubId) =>
    show(githubId, ["[data-hidden-toggle]", `[data-hide="${githubId}"]`, "[data-repos]", '.seg [aria-pressed="true"]']);

  // ------------------------------------------------------- Keeping up

  // Changed elsewhere: by another page of the app, the chat, or the settings.
  hearth.onChange(() => {
    read(true).catch(() => {});
  });
  // The minutes and ages move on by themselves; what others change shows within 15 seconds, and at once when Hearth is looked at again.
  setInterval(() => {
    if (!loaded) return;
    now = Date.now();
    const every = situation().elsewhere ? BUSY_POLL_MS : POLL_MS;
    if (document.visibilityState !== "hidden" && now - lastRead >= every) {
      read().catch(() => {});
      return;
    }
    draw();
    startIfDue();
  }, TICK_MS);
  document.addEventListener("visibilitychange", () => {
    if (loaded && document.visibilityState === "visible") read().catch(() => {});
  });

  draw();
  start();
})();
</script>
</body>
</html>
