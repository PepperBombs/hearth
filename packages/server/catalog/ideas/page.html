<!doctype html>
<html lang="en">
<head>
<title>Ideas</title>
<style>
/*
 * Ideas, a built-in app of Hearth: a timeline of short notes with #tags,
 * pins, search and an archive, after the design of Memos. In its card: a box
 * to write an idea at once and the three written last. On its own page:
 * everything. Colours come only from Hearth's variables, so both themes work.
 */
*, *::before, *::after { box-sizing: border-box; }
/* Room for the focus ring of what touches the frame's edge. */
body { padding: 4px; line-height: 1.57; -webkit-font-smoothing: antialiased; }
p, h2, h3, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button, input, textarea { margin: 0; font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, button[aria-disabled="true"] { cursor: not-allowed; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--hearth-accent); outline-offset: 2px; }
::selection { background: var(--hearth-accent-soft); color: var(--hearth-accent-text); }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.icon { flex: none; }

/* The kit's look: buttons, boxes, chips and the switch. */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 12px; border: 1px solid var(--hearth-line); border-radius: 8px;
  background: var(--hearth-surface); color: var(--hearth-text); font-weight: 500; white-space: nowrap; user-select: none;
}
.btn.primary { border-color: var(--hearth-accent); background: var(--hearth-accent); color: var(--hearth-surface); }
.btn.sm { height: 28px; padding: 0 8px; font-size: 12px; line-height: 20px; }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .55; }
@media (hover: hover) {
  .btn:not(:disabled):not([aria-disabled="true"]):hover { background: var(--hearth-surface-2); }
  .btn.primary:not(:disabled):not([aria-disabled="true"]):hover { background: var(--hearth-accent); opacity: .92; }
}
.input, .box {
  display: block; width: 100%; border: 1px solid var(--hearth-line); border-radius: 8px;
  background: var(--hearth-surface); color: var(--hearth-text); appearance: none;
}
.input { height: 36px; padding: 0 10px; }
.box { min-height: 76px; max-height: 320px; padding: 8px 10px; resize: vertical; field-sizing: content; }
.input::placeholder, .box::placeholder { color: var(--hearth-text-3); opacity: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 10px;
  border: 1px solid var(--hearth-line); border-radius: 999px; background: transparent;
  color: var(--hearth-text-2); font-size: 13px;
}
.chip[aria-pressed="true"] { border-color: var(--hearth-accent); background: var(--hearth-accent-soft); color: var(--hearth-accent-text); font-weight: 500; }
.chip-count { margin-left: 6px; font-size: 12px; color: var(--hearth-text-3); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--hearth-surface-2); }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--hearth-text-2); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--hearth-surface); color: var(--hearth-text); font-weight: 500; box-shadow: 0 0 0 1px var(--hearth-line); }
/* A thumb needs more room than a pointer. */
@media (pointer: coarse) {
  .btn { height: 44px; padding: 0 16px; }
  .btn.sm { height: 44px; padding: 0 12px; }
  .input { height: 44px; font-size: 16px; }
  .box { font-size: 16px; }
  .chip { height: 36px; padding: 0 14px; }
  .seg button { height: 40px; padding: 0 16px; }
  .row { min-height: 44px; }
  .shortcut { display: none; }
}

/* The page. */
.page { display: flex; flex-direction: column; gap: 16px; }
.composer, .edit { display: flex; flex-direction: column; gap: 8px; }
.composer-foot { display: flex; align-items: center; gap: 12px; }
.edit-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.hint, .used, .more { font-size: 12px; line-height: 20px; color: var(--hearth-text-3); }
.push { margin-left: auto; }
.controls { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.idea { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 12px; border: 1px solid var(--hearth-line); border-radius: 8px; }
.idea-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.tag { padding: 0; border: 0; border-radius: 4px; background: none; color: var(--hearth-accent-text); }
.tag[aria-pressed="true"] { font-weight: 500; }
@media (hover: hover) { .tag:hover { text-decoration: underline; } }
.idea-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; min-width: 0; font-size: 12px; line-height: 20px; color: var(--hearth-text-3); }
.pinned { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; color: var(--hearth-text-2); }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; margin-left: auto; }
.confirm { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--hearth-surface-2); }
.confirm-title { font-weight: 600; }
.confirm-body { color: var(--hearth-text-2); }
.confirm-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 2px; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 420px; margin: 0 auto; padding: 32px 8px; text-align: center; }
.empty-badge { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; margin-bottom: 4px; border-radius: 999px; background: var(--hearth-accent-soft); color: var(--hearth-accent-text); }
.empty-title { font-size: 16px; line-height: 1.4; font-weight: 600; }
.empty-body { color: var(--hearth-text-2); }
.empty-action { margin-top: 8px; }

/* The card. */
.card { display: flex; flex-direction: column; gap: 6px; min-height: 88px; }
.quick { display: flex; gap: 8px; }
.quick .input { flex: 1; min-width: 0; }
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 36px; padding: 6px 0; border-top: 1px solid var(--hearth-line); overflow-wrap: anywhere; }
.row:first-child { border-top: 0; }
.row-body { flex: 1; min-width: 0; }
.clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.row-meta { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 20px; color: var(--hearth-text-3); }
.card .empty { justify-content: center; min-height: 88px; padding: 8px; }

/* What went wrong, where it went wrong; and the shape of what is on its way. */
.alert { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--hearth-line); border-radius: 8px; background: var(--hearth-surface-2); }
.alert-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.alert-lead { font-weight: 600; }
.alert-reason { color: var(--hearth-text-2); }
.bones { display: flex; flex-direction: column; gap: 10px; }
.bone { height: 36px; border-radius: 8px; background: var(--hearth-surface-2); }
.bone.tall { height: 76px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script>
(() => {
  "use strict";
  const H = window.hearth;
  const ZH = H.locale === "zh";
  const CAN_EDIT = H.access === "edit";
  const PAGE = H.view === "page";
  document.documentElement.lang = ZH ? "zh-CN" : "en";

  /* ---------------------------------------------------------------------
   * Every interface string, in English and Chinese. What people write is
   * never translated.
   * ------------------------------------------------------------------- */
  const TEXT = {
    en: {
      write: "Write an idea",
      placeholder: "What's on your mind? Add #tags to group ideas.",
      save: "Save",
      shortcut: "Ctrl+Enter or ⌘+Enter saves.",
      search: "Search ideas",
      tags: "Tags",
      allTags: "All tags ({count})",
      fewerTags: "Fewer tags",
      view: "Ideas shown",
      active: "Active ({count})",
      archived: "Archived ({count})",
      pinned: "Pinned",
      pin: "Pin",
      unpin: "Unpin",
      edit: "Edit",
      editing: "Edit this idea",
      cancel: "Cancel",
      archive: "Archive",
      restore: "Bring back",
      delete: "Delete",
      deleteTitle: "Delete this idea?",
      deleteBody: "It will be gone for good. To put it away and keep it, archive it instead.",
      whenNow: "just now",
      whenMinutes: "{count} min ago",
      whenHours: "{count} h ago",
      whenYesterday: "yesterday, {time}",
      emptyFirst: "No ideas yet.",
      emptyFirstHint: "Write one down as soon as it comes to you.",
      emptyActive: "Every idea is archived.",
      emptyArchived: "Nothing archived.",
      emptyArchivedHint: "An idea that is done or given up can be put away here instead of deleted.",
      emptyFound: "Nothing found.",
      clear: "Clear filters",
      more: "Showing the first {count}. Search or pick a tag to find the rest.",
      loading: "Loading ideas…",
      loadFailed: "The ideas could not be read.",
      retry: "Try again",
      saveFailed: "The idea could not be saved.",
      changeFailed: "The idea could not be changed.",
      deleteFailed: "The idea could not be deleted.",
      gone: "That idea is gone: someone deleted it.",
      full: "This space holds 5000 ideas, as many as it can. Delete some of them first.",
      tooLong: "An idea holds at most 4000 characters.",
      dismiss: "Dismiss",
      saved: "Idea saved.",
      pinnedOne: "Idea pinned.",
      unpinnedOne: "Idea unpinned.",
      archivedOne: "Idea archived.",
      restoredOne: "Idea brought back.",
      deletedOne: "Idea deleted.",
    },
    zh: {
      write: "写下一个想法",
      placeholder: "想到了什么？加上 #标签 方便归类。",
      save: "保存",
      shortcut: "按 Ctrl+Enter 或 ⌘+Enter 保存。",
      search: "搜索想法",
      tags: "标签",
      allTags: "全部标签（{count}）",
      fewerTags: "收起标签",
      view: "显示范围",
      active: "当前（{count}）",
      archived: "已归档（{count}）",
      pinned: "已置顶",
      pin: "置顶",
      unpin: "取消置顶",
      edit: "编辑",
      editing: "编辑这个想法",
      cancel: "取消",
      archive: "归档",
      restore: "恢复",
      delete: "删除",
      deleteTitle: "删除这个想法？",
      deleteBody: "删除后无法恢复。如果只是想收起来留着，可以改为归档。",
      whenNow: "刚刚",
      whenMinutes: "{count} 分钟前",
      whenHours: "{count} 小时前",
      whenYesterday: "昨天 {time}",
      emptyFirst: "还没有想法。",
      emptyFirstHint: "想到什么，随手记下来。",
      emptyActive: "所有想法都已归档。",
      emptyArchived: "没有已归档的想法。",
      emptyArchivedHint: "已经完成或放弃的想法可以归档收起，不必删除。",
      emptyFound: "没有找到。",
      clear: "清除筛选",
      more: "只显示前 {count} 条。搜索或选择标签可以找到其余的想法。",
      loading: "正在读取想法…",
      loadFailed: "无法读取想法。",
      retry: "重试",
      saveFailed: "无法保存这个想法。",
      changeFailed: "无法修改这个想法。",
      deleteFailed: "无法删除这个想法。",
      gone: "这个想法已经被别人删除了。",
      full: "这个空间已经有 5000 个想法，不能再多了。请先删除一些。",
      tooLong: "一个想法最多 4000 个字。",
      dismiss: "关闭",
      saved: "想法已保存。",
      pinnedOne: "想法已置顶。",
      unpinnedOne: "已取消置顶。",
      archivedOne: "想法已归档。",
      restoredOne: "想法已恢复。",
      deletedOne: "想法已删除。",
    },
  };
  const WORDS = ZH ? TEXT.zh : TEXT.en;
  function t(key, values) {
    const text = WORDS[key] ?? TEXT.en[key] ?? key;
    return values === undefined ? text : text.replace(/\{(\w+)\}/g, (whole, name) => (name in values ? String(values[name]) : whole));
  }

  /* ---------------------------------------------------------------------
   * What an idea's text means: how long it may be, which of its words are
   * #tags, and how a search reads it (the old app's text.ts, as it was).
   * ------------------------------------------------------------------- */
  /** The longest text of an idea, in characters, after the spaces around it are taken off. */
  const LONGEST_IDEA = 4000;
  /** Text as a tag or a search compares it: "Idea", "IDEA" and "ｉｄｅａ" are the same. */
  const fold = (text) => text.normalize("NFKC").toLowerCase();
  /** A web address: what a "#" inside it belongs to. Only the characters an address is made of. */
  const WEB_ADDRESS = /https?:\/\/[A-Za-z0-9._~:/?#[\]@!$&'()*+,;=%-]+/gi;
  /** A tag: "#" (or "＃") and 1 to 30 letters, digits, "_" or "-" after it, in any script. A longer run is no tag. */
  const TAG = /[#＃]([\p{L}\p{M}\p{N}_＿－-]{1,30})(?![\p{L}\p{M}\p{N}_＿－-])/gu;
  /** What a tag still has to be once it is folded. */
  const FOLDED_TAG = /^[\p{L}\p{M}\p{N}_-]{1,30}$/u;
  /** A tag as it is kept and compared: without its "#", folded. */
  const tagKey = (tag) => fold(tag.trim().replace(/^[#＃]/, ""));
  /** The tags of a text, in its order: where each stands, "#" included, and the tag, folded. */
  function findTags(text) {
    const addresses = [...text.matchAll(WEB_ADDRESS)].map((match) => ({ start: match.index, end: match.index + match[0].length }));
    const found = [];
    for (const match of text.matchAll(TAG)) {
      const start = match.index;
      if (addresses.some((address) => start >= address.start && start < address.end)) continue;
      const tag = fold(match[1] ?? "");
      if (!FOLDED_TAG.test(tag)) continue;
      found.push({ start, end: start + match[0].length, tag });
    }
    return found;
  }
  /** The tags of a text as a row keeps them: each once, in the order they first come. */
  const tagsOf = (text) => [...new Set(findTags(text).map((found) => found.tag))];
  /** The words of a search, folded. Nothing typed, or spaces alone, is no word: everything matches. */
  const searchWords = (search) => fold(search).split(/\s+/).filter((word) => word !== "");
  /** Whether a text contains every one of the words, wherever each stands in it. */
  function containsWords(text, words) {
    if (words.length === 0) return true;
    const folded = fold(text);
    return words.every((word) => folded.includes(word));
  }

  /* ---------------------------------------------------------------------
   * A text in pieces, and when an idea was written, on the reader's clock
   * (the old app's format.ts).
   * ------------------------------------------------------------------- */
  /** An idea's text in pieces, in order: plain text, and tags as they were typed with the tag they stand for. */
  function partsOf(text) {
    const parts = [];
    let at = 0;
    for (const found of findTags(text)) {
      if (found.start > at) parts.push({ kind: "text", text: text.slice(at, found.start) });
      parts.push({ kind: "tag", text: text.slice(found.start, found.end), tag: found.tag });
      at = found.end;
    }
    if (at < text.length) parts.push({ kind: "text", text: text.slice(at) });
    return parts;
  }
  const INTL = ZH ? "zh-CN" : "en-US";
  const TIME_OF_DAY = new Intl.DateTimeFormat(INTL, { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const DATE_AND_TIME = new Intl.DateTimeFormat(INTL, { dateStyle: "medium", timeStyle: "short", hourCycle: "h23" });
  const DAY = new Intl.DateTimeFormat(INTL, { month: "short", day: "numeric" });
  const DAY_AND_YEAR = new Intl.DateTimeFormat(INTL, { year: "numeric", month: "short", day: "numeric" });
  const MINUTE_MS = 60 * 1000;
  const sameDay = (one, other) =>
    one.getFullYear() === other.getFullYear() && one.getMonth() === other.getMonth() && one.getDate() === other.getDate();
  /** "Nov 10, 2026, 08:05", "2026年11月10日 08:05". */
  function dateAndTime(at) {
    const date = new Date(at);
    return Number.isNaN(date.getTime()) ? "" : DATE_AND_TIME.format(date);
  }
  /**
   * "just now" under a minute, "5 min ago" under an hour, "3 h ago" for the
   * rest of the same day, "yesterday, 14:05" for the day before, then the
   * date ("Nov 3"), with its year when that is not this one.
   */
  function whenText(at, now) {
    const written = new Date(at);
    if (Number.isNaN(written.getTime())) return "";
    // A time the server's clock put a little ahead of this browser's is "just now".
    const minutes = Math.floor((now - written.getTime()) / MINUTE_MS);
    if (minutes < 1) return t("whenNow");
    if (minutes < 60) return t("whenMinutes", { count: minutes });
    const today = new Date(now);
    if (sameDay(written, today)) return t("whenHours", { count: Math.floor(minutes / 60) });
    const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1);
    if (sameDay(written, yesterday)) return t("whenYesterday", { time: TIME_OF_DAY.format(written) });
    return (written.getFullYear() === today.getFullYear() ? DAY : DAY_AND_YEAR).format(written);
  }

  /* ---------------------------------------------------------------------
   * The ideas, as this page holds them. All of a space's ideas are read at
   * once (5000 at most, as the old app held), and the views, the tags and
   * the search are worked out here.
   * ------------------------------------------------------------------- */
  /** How many ideas a space holds at most, archived ones included. */
  const MOST_IDEAS = 5000;
  /** How many ideas the timeline shows before "Showing the first …". */
  const SHOWN = 200;
  /** How many ideas the card shows. */
  const LATEST = 3;
  /** How many tags are chips before "All tags (n)" is pressed: the most used. */
  const CHIPS_SHOWN = 12;
  /** From this many characters on, a box says how many of the 4000 are used. */
  const COUNT_FROM = LONGEST_IDEA - 500;
  /** How many tags a row's list field holds. */
  const MOST_TAGS = 100;
  /** How often the clock and the ideas are read again, so that what others write shows here too. */
  const TICK_MS = 15000;
  /** Where the focus goes when the idea that had it left the timeline. */
  const AFTER_LEAVING = ["[data-ideas]:not([hidden])", '[aria-pressed="true"]', "[data-composer]"];

  const state = {
    loaded: false,
    loadError: null,
    /** Every idea, the newest first, as the store orders them. */
    all: [],
    signature: "",
    view: "active",
    /** The tag chosen, folded; "" for every tag. */
    tag: "",
    typed: "",
    allTags: false,
    editing: null,
    deleting: null,
    /** The ideas a change is on its way for: their buttons wait. */
    busy: new Set(),
    adding: false,
    /** What went wrong, and where: "composer", "page" or an idea's ID. */
    alert: null,
    now: Date.now(),
  };

  /** The tags and the folded text of each idea, worked out once per text. */
  const known = new Map();
  function prepare(row) {
    const text = typeof row.text === "string" ? row.text : "";
    let cached = known.get(row.id);
    if (!cached || cached.text !== text) {
      cached = { text, tags: tagsOf(text), folded: fold(text) };
      known.set(row.id, cached);
    }
    const archived = row.archived === true;
    return {
      id: row.id,
      text,
      createdAt: String(row.createdAt ?? ""),
      updatedAt: String(row.updatedAt ?? ""),
      archived,
      // An archived idea is never pinned.
      pinned: row.pinned === true && !archived,
      // The tags of the text, read afresh: a tag the page draws is a tag its chip finds.
      tags: cached.tags,
      folded: cached.folded,
    };
  }
  const matches = (idea, words) => words.length === 0 || words.every((word) => idea.folded.includes(word));
  const signatureOf = (ideas) => ideas.map((idea) => `${idea.id}@${idea.updatedAt}`).join("\n");
  const find = (id) => state.all.find((idea) => idea.id === id);
  function setAll(ideas) {
    state.all = ideas;
    state.signature = signatureOf(ideas);
  }

  /* ---------------------------------------------------------------------
   * Reading the ideas: at the start, when they changed elsewhere, and every
   * 15 seconds while the page is seen. A reading that was on its way while
   * this page changed something is read again, so it never undoes the change.
   * ------------------------------------------------------------------- */
  let generation = 0;
  let pending = 0;
  let reading = false;
  let readAgain = false;
  function read() {
    if (reading) {
      readAgain = true;
      return;
    }
    reading = true;
    readAgain = false;
    const at = generation;
    H.list("ideas", { orderBy: "createdAt", desc: true, limit: MOST_IDEAS })
      .then(
        (rows) => {
          if (pending === 0 && at === generation) apply(rows);
          else readAgain = true;
        },
        (error) => {
          // Once the ideas are shown they stay; the next reading tries again.
          if (!state.loaded) {
            state.loadError = reasonOf(error);
            render();
          }
        },
      )
      .finally(() => {
        reading = false;
        settle();
      });
  }
  function settle() {
    if (readAgain && pending === 0 && !reading) read();
  }
  function apply(rows) {
    if (!Array.isArray(rows)) return;
    const ideas = rows.filter((row) => row && typeof row.id === "string").map(prepare);
    const signature = signatureOf(ideas);
    if (state.loaded && signature === state.signature) return;
    const ids = new Set(ideas.map((idea) => idea.id));
    for (const id of known.keys()) if (!ids.has(id)) known.delete(id);
    setAll(ideas);
    state.loaded = true;
    state.loadError = null;
    // An idea someone else deleted while this page had something to say about it.
    if (state.alert && state.alert.at !== "page" && state.alert.at !== "composer" && !ids.has(state.alert.at)) {
      setAlert("page", t("gone"));
    }
    render();
  }
  const reasonOf = (error) => (error instanceof Error ? error.message : String(error));

  /* ---------------------------------------------------------------------
   * Changing the ideas. What the store answers goes into the timeline at
   * once; a change that fails is read again, in case the idea is gone.
   * ------------------------------------------------------------------- */
  /** A text as it is kept: line breaks as "\n", no spaces around it. */
  const keptText = (typed) => typed.replace(/\r\n?/g, "\n").trim();
  const keptTags = (text) => tagsOf(text).slice(0, MOST_TAGS);

  function begin() {
    pending += 1;
    generation += 1;
  }
  function end() {
    pending -= 1;
    generation += 1;
  }

  async function addIdea() {
    const field = composer.field;
    const sent = field.value;
    const text = keptText(sent);
    if (state.adding || text === "") return;
    clearAlert();
    if (text.length > LONGEST_IDEA) return showAlert("composer", t("tooLong"));
    if (state.all.length >= MOST_IDEAS) return showAlert("composer", t("full"));
    state.adding = true;
    begin();
    syncComposer();
    try {

      event.preventDefault();
      saveEdit(id, area);
    });
    sync();
    return { form, area, busy: (busy) => markBusy(save, busy) };
  }
  /** "Delete" asks first, in the idea's place: the page's own dialogs are blocked in the sandbox. */
  function confirmPanel(idea) {
    const id = idea.id;
    const titleId = `confirm-title-${++ids}`;
    const bodyId = `confirm-body-${ids}`;
    const cancel = h("button", { type: "button", class: "btn sm", "data-key": keyOf("confirm-cancel", id), onclick: () => keepIdea(id) }, t("cancel"));
    const remove = h(
      "button",
      {
        type: "button",
        class: "btn sm primary",
        "data-key": keyOf("confirm-delete", id),
        onclick: () => {
          const current = find(id);
          if (current && !state.busy.has(id)) confirmDelete(current);
        },
      },
      t("delete"),
    );
    const panel = h(
      "div",
      { class: "confirm", role: "group", "aria-labelledby": titleId, "aria-describedby": bodyId },
      h("p", { class: "confirm-title", id: titleId }, t("deleteTitle")),
      h("p", { class: "confirm-body", id: bodyId }, t("deleteBody")),
      h("div", { class: "confirm-actions" }, cancel, remove),
    );
    panel.addEventListener("keydown", (event) => {
      if (event.key !== "Escape" || event.isComposing) return;
      event.preventDefault();
      keepIdea(id);
    });
    return {
      panel,
      busy: (busy) => {
        markBusy(cancel, busy);
        markBusy(remove, busy);
      },
    };
  }

  /** The tags of the active ideas as chips, the most used first, and the one chosen, which only archived ideas may carry. */
  let chipsShown = null;
  function renderChips(tags) {
    const visible = state.allTags ? tags : tags.slice(0, CHIPS_SHOWN);
    const chosen =
      state.tag !== "" && !visible.some((entry) => entry.tag === state.tag)
        ? [{ tag: state.tag, count: (tags.find((entry) => entry.tag === state.tag) || { count: 0 }).count }]
        : [];
    const entries = [...visible, ...chosen];
    const extra = tags.length > CHIPS_SHOWN;
    const shape = JSON.stringify([entries, extra, state.allTags]);
    if (shape !== chipsShown) {
      chipsShown = shape;
      chips.textContent = "";
      for (const entry of entries) {
        chips.append(
          h(
            "button",
            { type: "button", class: "chip", "data-tag": entry.tag, "data-key": `chip:${entry.tag}`, onclick: () => pickTag(entry.tag) },
            // A space of its own, which no screen shows: the chip is read as "#v2 1", not "#v21".
            `#${entry.tag} `,
            entry.count > 0 ? h("span", { class: "chip-count num" }, String(entry.count)) : null,
          ),
        );
      }
      if (extra) {
        const label = state.allTags ? t("fewerTags") : t("allTags", { count: tags.length });
        chips.append(h("button", { type: "button", class: "chip", "data-key": "chip:all", onclick: () => ((state.allTags = !state.allTags), render()) }, label));
      }
    }
    for (const chip of chips.children) {
      chip.setAttribute("aria-pressed", String(chip.dataset.tag === undefined ? state.allTags : chip.dataset.tag === state.tag));
    }
    chips.hidden = entries.length === 0;
  }

  /** What a view shows when it has nothing to list, and why. */
  let emptyShown;
  function renderEmpty(kind) {
    if (kind === emptyShown) return;
    emptyShown = kind;
    emptyBox.textContent = "";
    emptyBox.hidden = kind === null;
    if (kind === null) return;
    const title = { found: "emptyFound", archived: "emptyArchived", active: "emptyActive", first: "emptyFirst" }[kind];
    if (!PAGE) {
      emptyBox.append(h("h3", { class: "empty-title" }, t(title)));
      return;
    }
    if (kind === "first") emptyBox.append(h("span", { class: "empty-badge", "aria-hidden": "true" }, icon(STAR, 20)));
    emptyBox.append(h("h2", { class: "empty-title" }, t(title)));
    if (kind === "archived") emptyBox.append(h("p", { class: "empty-body" }, t("emptyArchivedHint")));
    if (kind === "first" && CAN_EDIT) emptyBox.append(h("p", { class: "empty-body" }, t("emptyFirstHint")));
    if (kind === "found") {
      emptyBox.append(h("div", { class: "empty-action" }, h("button", { type: "button", class: "btn", "data-key": "clear", onclick: clearFilters }, t("clear"))));
    }
  }

  /** The failure shown: under the box it was written in, in the idea it was about, or above the timeline. */
  function placeAlert() {
    const alert = state.alert;
    if (alert === null) {
      if (alertBox) alertBox.remove();
      alertBox = null;
      return;
    }
    if (!alertBox || alertBox.dataset.n !== String(alert.n)) {
      if (alertBox) alertBox.remove();
      const dismiss = () => {
        const at = alert.at;
        clearAlert();
        wantFocus(at === "composer" ? "[data-composer]" : keyed("edit", at), "[data-composer]", "[data-ideas]:not([hidden])");
        render();
      };
      alertBox = h(
        "div",
        { class: "alert", role: "alert", "data-n": alert.n },
        h("p", { class: "alert-text" }, h("span", { class: "alert-lead" }, alert.lead), alert.reason ? [" ", h("span", { class: "alert-reason" }, alert.reason)] : null),
        h("button", { type: "button", class: "btn sm", "data-key": "dismiss", onclick: dismiss }, t("dismiss")),
      );
    }
    const item = pageItems.get(alert.at);
    if (alert.at === "composer" && composer) {
      if (alertBox.previousSibling !== composer.form) composer.form.after(alertBox);
    } else if (item) {
      if (alertBox.parentNode !== item.li || item.li.lastChild !== alertBox) item.li.append(alertBox);
    } else {
      const anchor = PAGE ? timeline : rowsList;
      if (alertBox.nextSibling !== anchor) anchor.before(alertBox);
    }
  }

  /* ---------------------------------------------------------------------
   * Start: the shape of the page, then the ideas.
   * ------------------------------------------------------------------- */
  render();
  read();
  // Changed elsewhere: by the chat, the app's card or its page in another place.
  H.onChange(read);
  // "5 min ago" moves on by itself, and what others in the space write shows up.
  setInterval(() => {
    state.now = Date.now();
    if (state.loaded) render();
    if (document.visibilityState !== "hidden") read();
  }, TICK_MS);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    state.now = Date.now();
    if (state.loaded) render();
    read();
  });
  // Unused, but kept with the rest of text.ts, which a model reading this page may want.
  void containsWords;
})();
</script>
</body>
</html>
